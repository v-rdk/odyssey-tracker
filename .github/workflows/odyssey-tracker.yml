name: BFI Odyssey ticket tracker

on:
  schedule:
    # Hourly. GitHub delays scheduled runs under load, so treat this as
    # "some time in the hour" rather than exactly on the hour.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: odyssey-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          # Real Chrome rather than bundled Chromium: much harder to fingerprint.
          playwright install --with-deps chrome
          sudo apt-get update -qq
          sudo apt-get install -y xvfb

      - name: Run tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_PATH: state.json
          PAUSE_SECONDS: "8"
          TAIL_PAGES: "2"
        # xvfb-run gives Chrome a virtual display so it can run headed.
        run: xvfb-run -a python bfi_odyssey_tracker.py

      - name: Persist state
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "odyssey-tracker"
            git config user.email "actions@github.com"
            git add state.json
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi
        shell: bash

name: BFI Odyssey ticket tracker

on:
  schedule:
    # Every 10 minutes. GitHub often delays scheduled runs under load, so treat
    # this as "within ~15 minutes" rather than a hard guarantee.
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Needed so the job can commit state.json back to the repo.
permissions:
  contents: write

concurrency:
  group: odyssey-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_PATH: state.json
          WATCH_RETURNS: "0"
        run: python bfi_odyssey_tracker.py

      - name: Persist state
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "odyssey-tracker"
            git config user.email "actions@github.com"
            git add state.json
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi
        shell: bash
